name: Sandbox smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly sandbox smoke on Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect smoke-relevant changes
    runs-on: ubuntu-latest
    outputs:
      run_smoke: ${{ steps.decide.outputs.run_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Paths filter
        id: paths
        uses: dorny/paths-filter@v4
        with:
          filters: |
            smoke:
              - 'src/**'
              - 'samples/**'
              - 'scripts/ci/**'

      - name: Decide smoke eligibility
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PATHS_SMOKE: ${{ steps.paths.outputs.smoke }}
          FREEAGENT_BATCH_SKIP_SMOKE: ${{ vars.FREEAGENT_BATCH_SKIP_SMOKE }}
        run: |
          if [[ "$FREEAGENT_BATCH_SKIP_SMOKE" == "true" ]]; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — repository variable FREEAGENT_BATCH_SKIP_SMOKE is true."
            exit 0
          fi

          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — Dependabot pull requests do not run live API smoke."
            exit 0
          fi

          case "$EVENT" in
            schedule|workflow_dispatch)
              echo "run_smoke=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ "$PATHS_SMOKE" == "true" ]]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — no changes under src/, samples/, or scripts/ci/."
          fi

  build-console-smoke:
    name: Build console smoke
    if: needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Build console sample
        run: |
          dotnet restore FreeAgent.slnx
          dotnet build FreeAgent.slnx --no-restore --configuration Release -warnaserror

      - name: Publish console sample for smoke
        run: dotnet publish samples/FreeAgent.Client.ConsoleSample/FreeAgent.Client.ConsoleSample.csproj --configuration Release --no-build -o "$RUNNER_TEMP/console-smoke"

      - name: Upload console smoke build
        uses: actions/upload-artifact@v7
        with:
          name: console-smoke
          path: ${{ runner.temp }}/console-smoke

  console-smoke:
    name: Console Sample Smoke
    if: needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    needs: [build-console-smoke, changes]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve smoke policy
        id: policy
        env:
          REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
        run: |
          if [[ -n "$REFRESH_TOKEN" ]]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ github.event_name }}" in
            push|schedule|workflow_dispatch)
              if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                echo "mode=required" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac

          echo "mode=skip" >> "$GITHUB_OUTPUT"

      - name: Require sandbox credentials on main
        if: steps.policy.outputs.mode == 'required'
        run: |
          echo "::error::FREEAGENT_REFRESH_TOKEN is not configured. See docs/contributing/ci-sandbox-smoke.md"
          exit 1

      - name: Skip sandbox smoke
        if: steps.policy.outputs.mode == 'skip'
        run: |
          echo "Skipping console smoke - FREEAGENT_REFRESH_TOKEN not configured"

      - name: Download console smoke build
        if: steps.policy.outputs.mode == 'run'
        uses: actions/download-artifact@v8
        with:
          name: console-smoke
          path: console-smoke

      - name: Refresh sandbox access token
        if: steps.policy.outputs.mode == 'run'
        id: auth
        env:
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
          FREEAGENT_REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
        run: bash scripts/ci/refresh-freeagent-access-token.sh

      - name: Run console sample examples
        if: steps.policy.outputs.mode == 'run'
        env:
          FREEAGENT_ENVIRONMENT: Sandbox
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
          FREEAGENT_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: dotnet console-smoke/FreeAgent.Client.ConsoleSample.dll -- --seed-turpinverse --run-all
