name: Sandbox smoke

on:
  # Queued by CI after Build & Test succeeds (repository_dispatch). Listeners use the default branch workflow file.
  # Do not use workflow_run with branches: [main] — for pull_request CI, head_branch is the PR branch, not main.
  repository_dispatch:
    types: [sandbox-smoke]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-smoke-${{ github.event.client_payload.sha || github.sha }}
  cancel-in-progress: true

jobs:
  smoke-trigger:
    name: Confirm smoke should run
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Decide whether this workflow should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_EVENT: ${{ github.event.client_payload.event }}
          PAYLOAD_BASE_REF: ${{ github.event.client_payload.base_ref }}
          PAYLOAD_HEAD_BRANCH: ${{ github.event.client_payload.head_branch }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "repository_dispatch" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$PAYLOAD_EVENT" in
            pull_request)
              if [[ "$PAYLOAD_BASE_REF" == "main" ]]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "Sandbox smoke skipped — pull request does not target main."
              fi
              ;;
            push)
              if [[ "$PAYLOAD_HEAD_BRANCH" == "main" ]]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "Sandbox smoke skipped — push CI was not on main."
              fi
              ;;
            schedule)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              if [[ "$PAYLOAD_HEAD_BRANCH" == "main" ]]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "Sandbox smoke skipped — manual CI was not on main."
              fi
              ;;
            *)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Sandbox smoke skipped — CI event '$PAYLOAD_EVENT' is not supported."
              ;;
          esac

  changes:
    name: Detect smoke-relevant changes
    if: needs.smoke-trigger.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    needs: [smoke-trigger]
    outputs:
      run_smoke: ${{ steps.decide.outputs.run_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}
          fetch-depth: 0

      - name: Paths filter
        id: paths
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.client_payload.base_sha || github.event.client_payload.sha || github.sha }}
          ref: ${{ github.event.client_payload.sha || github.sha }}
          filters: |
            smoke:
              - 'src/**'
              - 'samples/**'
              - 'scripts/ci/**'

      - name: Decide smoke eligibility
        id: decide
        env:
          EVENT: ${{ github.event.client_payload.event || github.event_name }}
          ACTOR: ${{ github.event.client_payload.actor || github.actor }}
          PATHS_SMOKE: ${{ steps.paths.outputs.smoke }}
          FREEAGENT_BATCH_SKIP_SMOKE: ${{ vars.FREEAGENT_BATCH_SKIP_SMOKE }}
        run: |
          if [[ "$FREEAGENT_BATCH_SKIP_SMOKE" == "true" ]]; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — repository variable FREEAGENT_BATCH_SKIP_SMOKE is true."
            exit 0
          fi

          if [[ "$ACTOR" == "dependabot[bot]" && "$EVENT" == "pull_request" ]]; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — Dependabot pull requests do not run live API smoke."
            exit 0
          fi

          case "$EVENT" in
            schedule|workflow_dispatch)
              echo "run_smoke=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ "$PATHS_SMOKE" == "true" ]]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — no changes under src/, samples/, or scripts/ci/."
          fi

  build-console-smoke:
    name: Build console smoke
    if: needs.smoke-trigger.outputs.enabled == 'true' && needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    needs: [smoke-trigger, changes]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Build console sample
        run: |
          dotnet restore FreeAgent.slnx
          dotnet build FreeAgent.slnx --no-restore --configuration Release -warnaserror

      - name: Publish console sample for smoke
        run: dotnet publish samples/FreeAgent.Client.ConsoleSample/FreeAgent.Client.ConsoleSample.csproj --configuration Release --no-build -o "$RUNNER_TEMP/console-smoke"

      - name: Upload console smoke build
        uses: actions/upload-artifact@v7
        with:
          name: console-smoke-${{ github.event.client_payload.sha || github.sha }}
          path: ${{ runner.temp }}/console-smoke

  console-smoke:
    name: Console Sample Smoke
    if: >-
      needs.smoke-trigger.outputs.enabled == 'true' &&
      needs.changes.outputs.run_smoke == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        github.event.client_payload.head_repository == github.repository)
    runs-on: ubuntu-latest
    needs: [smoke-trigger, build-console-smoke, changes]
    timeout-minutes: 25

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve smoke policy
        id: policy
        env:
          REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CI_EVENT: ${{ github.event.client_payload.event }}
          HEAD_BRANCH: ${{ github.event.client_payload.head_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ -n "$REFRESH_TOKEN" ]]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            if [[ "$HEAD_BRANCH" == "main" && ( "$CI_EVENT" == "push" || "$CI_EVENT" == "schedule" ) ]]; then
              echo "mode=required" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_REF" == "refs/heads/main" ]]; then
            echo "mode=required" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=skip" >> "$GITHUB_OUTPUT"

      - name: Require sandbox credentials on main
        if: steps.policy.outputs.mode == 'required'
        run: |
          echo "::error::FREEAGENT_REFRESH_TOKEN is not configured. See docs/contributing/ci-sandbox-smoke.md"
          exit 1

      - name: Skip sandbox smoke
        if: steps.policy.outputs.mode == 'skip'
        run: |
          echo "Skipping console smoke - FREEAGENT_REFRESH_TOKEN not configured"

      - name: Checkout
        if: steps.policy.outputs.mode == 'run'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Download console smoke build
        if: steps.policy.outputs.mode == 'run'
        uses: actions/download-artifact@v8
        with:
          name: console-smoke-${{ github.event.client_payload.sha || github.sha }}
          path: console-smoke

      - name: Refresh sandbox access token
        if: steps.policy.outputs.mode == 'run'
        id: auth
        env:
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
          FREEAGENT_REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
        run: bash scripts/ci/refresh-freeagent-access-token.sh

      - name: Run console sample examples
        if: steps.policy.outputs.mode == 'run'
        env:
          FREEAGENT_ENVIRONMENT: Sandbox
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
          FREEAGENT_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: dotnet console-smoke/FreeAgent.Client.ConsoleSample.dll -- --seed-turpinverse --run-all
