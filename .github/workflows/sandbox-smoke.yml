name: Sandbox smoke

on:
  # Fires after every CI completion; the smoke-trigger job filters to PRs/pushes/schedules we care about.
  # Do not set branches here — for pull_request CI runs, head_branch is the PR branch, not main.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  smoke-trigger:
    name: Confirm smoke should run
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Decide whether this workflow should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$WR_CONCLUSION" != "success" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — triggering CI workflow did not succeed."
            exit 0
          fi

          case "$WR_EVENT" in
            pull_request|schedule)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            push)
              if [[ "$WR_HEAD_BRANCH" == "main" ]]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "Sandbox smoke skipped — push CI was not on main."
              fi
              ;;
            *)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Sandbox smoke skipped — CI event '$WR_EVENT' is not pull_request, push, or schedule."
              ;;
          esac

  changes:
    name: Detect smoke-relevant changes
    if: needs.smoke-trigger.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    needs: [smoke-trigger]
    outputs:
      run_smoke: ${{ steps.decide.outputs.run_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Paths filter
        id: paths
        uses: dorny/paths-filter@v4
        with:
          filters: |
            smoke:
              - 'src/**'
              - 'samples/**'
              - 'scripts/ci/**'

      - name: Decide smoke eligibility
        id: decide
        env:
          EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || github.event_name }}
          ACTOR: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.triggering_actor.login || github.actor }}
          PATHS_SMOKE: ${{ steps.paths.outputs.smoke }}
          FREEAGENT_BATCH_SKIP_SMOKE: ${{ vars.FREEAGENT_BATCH_SKIP_SMOKE }}
        run: |
          if [[ "$FREEAGENT_BATCH_SKIP_SMOKE" == "true" ]]; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — repository variable FREEAGENT_BATCH_SKIP_SMOKE is true."
            exit 0
          fi

          if [[ "$ACTOR" == "dependabot[bot]" && "$EVENT" == "pull_request" ]]; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — Dependabot pull requests do not run live API smoke."
            exit 0
          fi

          case "$EVENT" in
            schedule|workflow_dispatch)
              echo "run_smoke=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ "$PATHS_SMOKE" == "true" ]]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Sandbox smoke skipped — no changes under src/, samples/, or scripts/ci/."
          fi

  build-console-smoke:
    name: Build console smoke
    if: needs.smoke-trigger.outputs.enabled == 'true' && needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    needs: [smoke-trigger, changes]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Build console sample
        run: |
          dotnet restore FreeAgent.slnx
          dotnet build FreeAgent.slnx --no-restore --configuration Release -warnaserror

      - name: Publish console sample for smoke
        run: dotnet publish samples/FreeAgent.Client.ConsoleSample/FreeAgent.Client.ConsoleSample.csproj --configuration Release --no-build -o "$RUNNER_TEMP/console-smoke"

      - name: Upload console smoke build
        uses: actions/upload-artifact@v7
        with:
          name: console-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/console-smoke

  console-smoke:
    name: Console Sample Smoke
    if: needs.smoke-trigger.outputs.enabled == 'true' && needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    needs: [smoke-trigger, build-console-smoke, changes]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve smoke policy
        id: policy
        env:
          REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
        run: |
          if [[ -n "$REFRESH_TOKEN" ]]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EVENT="${{ github.event_name }}"
          if [[ "$EVENT" == "workflow_run" ]]; then
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            WR_EVENT="${{ github.event.workflow_run.event }}"
            if [[ "$HEAD_BRANCH" == "main" && ( "$WR_EVENT" == "push" || "$WR_EVENT" == "schedule" ) ]]; then
              echo "mode=required" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT" == "workflow_dispatch" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "mode=required" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=skip" >> "$GITHUB_OUTPUT"

      - name: Require sandbox credentials on main
        if: steps.policy.outputs.mode == 'required'
        run: |
          echo "::error::FREEAGENT_REFRESH_TOKEN is not configured. See docs/contributing/ci-sandbox-smoke.md"
          exit 1

      - name: Skip sandbox smoke
        if: steps.policy.outputs.mode == 'skip'
        run: |
          echo "Skipping console smoke - FREEAGENT_REFRESH_TOKEN not configured"

      - name: Download console smoke build
        if: steps.policy.outputs.mode == 'run'
        uses: actions/download-artifact@v8
        with:
          name: console-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
          path: console-smoke

      - name: Refresh sandbox access token
        if: steps.policy.outputs.mode == 'run'
        id: auth
        env:
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
          FREEAGENT_REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
        run: bash scripts/ci/refresh-freeagent-access-token.sh

      - name: Run console sample examples
        if: steps.policy.outputs.mode == 'run'
        env:
          FREEAGENT_ENVIRONMENT: Sandbox
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
          FREEAGENT_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: dotnet console-smoke/FreeAgent.Client.ConsoleSample.dll -- --seed-turpinverse --run-all
