name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly CI on Monday 06:00 UTC (paired with sandbox-smoke.yml schedule)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FreeAgent.slnx

      - name: Verify formatting
        run: dotnet format FreeAgent.slnx --no-restore --verify-no-changes --verbosity minimal

  docs-site:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build Jekyll site
        working-directory: docs
        run: bundle exec jekyll build --destination _site

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Clean, restore, build, and test
        run: |
          dotnet clean FreeAgent.slnx
          dotnet restore FreeAgent.slnx
          dotnet build FreeAgent.slnx --no-restore --configuration Release -warnaserror
          dotnet test FreeAgent.slnx --no-build --configuration Release --report-trx --results-directory TestResults

      - name: File-based app smoke (trim-safe JSON)
        run: dotnet run samples/FileBasedQuickStart/CompanyDeserializeSmoke.cs --configuration Release

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
