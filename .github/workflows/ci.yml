name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly sandbox smoke on Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore FreeAgent.slnx

      - name: Verify formatting
        run: dotnet format FreeAgent.slnx --no-restore --verify-no-changes --verbosity minimal

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Clean, restore, build, and test
        run: |
          dotnet clean FreeAgent.slnx
          dotnet restore FreeAgent.slnx
          dotnet build FreeAgent.slnx --no-restore --configuration Release -warnaserror
          dotnet test FreeAgent.slnx --no-build --configuration Release --report-trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

  console-smoke:
    name: Console Sample Smoke
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    permissions:
      contents: read
      secrets: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve smoke policy
        id: policy
        env:
          REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
        run: |
          if [[ -n "$REFRESH_TOKEN" ]]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ github.event_name }}" in
            push|schedule|workflow_dispatch)
              if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                echo "mode=required" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac

          echo "mode=skip" >> "$GITHUB_OUTPUT"

      - name: Require sandbox credentials on main
        if: steps.policy.outputs.mode == 'required'
        run: |
          echo "::error::FREEAGENT_REFRESH_TOKEN is not configured. See docs/contributing/ci-sandbox-smoke.md"
          exit 1

      - name: Skip sandbox smoke
        if: steps.policy.outputs.mode == 'skip'
        run: |
          echo "Skipping console smoke - FREEAGENT_REFRESH_TOKEN not configured"

      - name: Refresh sandbox access token
        if: steps.policy.outputs.mode == 'run'
        id: auth
        env:
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
          FREEAGENT_REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
        run: bash scripts/ci/refresh-freeagent-access-token.sh

      - name: Rotate refresh token secret when changed
        if: steps.policy.outputs.mode == 'run'
        env:
          GH_TOKEN: ${{ github.token }}
          STORED_REFRESH_TOKEN: ${{ secrets.FREEAGENT_REFRESH_TOKEN }}
          NEW_REFRESH_TOKEN: ${{ steps.auth.outputs.refresh_token }}
        run: |
          if [[ -z "$NEW_REFRESH_TOKEN" || "$NEW_REFRESH_TOKEN" == "$STORED_REFRESH_TOKEN" ]]; then
            echo "Refresh token unchanged; secret rotation not required"
            exit 0
          fi

          echo "::add-mask::$NEW_REFRESH_TOKEN"
          gh secret set FREEAGENT_REFRESH_TOKEN --body "$NEW_REFRESH_TOKEN"
          echo "Updated FREEAGENT_REFRESH_TOKEN repository secret"

      - name: Run console sample examples
        if: steps.policy.outputs.mode == 'run'
        env:
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
          FREEAGENT_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: dotnet run --project samples/FreeAgent.Client.ConsoleSample --configuration Release -- --run-all
