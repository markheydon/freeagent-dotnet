version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    assignees:
      - "markheydon"
    labels:
      - "type/chore"
    groups:
      nuget-test-packages:
        patterns:
          - "xunit*"
          - "Moq"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Testing.*"
          - "coverlet*"
        update-types:
          - "minor"
          - "patch"
      nuget-microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
        update-types:
          - "minor"
          - "patch"
      nuget-azure:
        patterns:
          - "Azure.*"
        update-types:
          - "minor"
          - "patch"
      nuget-opentelemetry:
        patterns:
          - "OpenTelemetry.*"
        update-types:
          - "minor"
          - "patch"
      nuget-analyzers:
        patterns:
          - "*Analyzer*"
          - "Microsoft.CodeAnalysis*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bundler"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    assignees:
      - "markheydon"
    labels:
      - "type/chore"
    groups:
      bundler-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    assignees:
      - "markheydon"
    labels:
      - "type/chore"
    groups:
      github-actions-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    assignees:
      - "markheydon"
    labels:
      - "type/chore"
    groups:
      devcontainers-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
